[build-system]
# setuptools is the least surprising choice for a plain src-less layout and is
# already present on almost every distro. The build backend is what turns this
# tree into something `pip install .` understands.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probolos"
# THE single source of truth for the version. probolos/__init__.py reads it
# back through importlib.metadata rather than repeating it; the literal in that
# file is a source-checkout fallback only and carries a "+source" suffix so the
# two can never silently disagree again (they did: 0.5.1 vs 0.9.0).
version = "0.9.0"
description = "A deny-by-default USB admission gate for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
keywords = ["usb", "security", "badusb", "linux", "sysfs", "hardening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # GPL, not MIT. LICENSE, README and the `license` field above all say
    # GPLv3; this classifier said MIT, and the classifier is the one that ends
    # up in the published metadata -- so an installed package would have told
    # everyone the opposite of what the repository says, under the one heading
    # where being wrong has legal consequences rather than cosmetic ones.
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

# Runtime dependencies. pyudev drives the event loop; the desktop-dialog
# backends (kdialog/zenity/tkinter) are optional and discovered at runtime,
# so they are deliberately NOT hard requirements here.
dependencies = [
    "pyudev>=0.24",
]

[project.optional-dependencies]
# `pip install .[agent]` pulls the Tk fallback for the desktop prompt. kdialog
# and zenity are system packages, not pip ones, so they stay out of here.
agent = []
dev = []

[project.urls]
Homepage = "https://github.com/capitan0n/probolos"
Source = "https://github.com/capitan0n/probolos"
Changelog = "https://github.com/capitan0n/probolos/blob/main/CHANGELOG.md"

[project.scripts]
# This is the payoff: `probolos` becomes a real command on PATH after install,
# which removes the "must cd to repo root" dependency and lets the systemd unit
# call an absolute ExecStart instead of `python -m probolos` with a WorkingDirectory.
probolos = "probolos.__main__:main"

[tool.setuptools]
# Explicit package list so the testbed/ and tests/ trees are not shipped as
# importable packages of the installed distribution.
packages = ["probolos"]
