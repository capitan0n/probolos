[build-system]
# setuptools is the least surprising choice for a plain src-less layout and is
# already present on almost every distro. The build backend is what turns this
# tree into something `pip install .` understands. 77 is the first release
# that reads the SPDX `license` expression below (PEP 639).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probolos"
# THE single source of truth for the version. probolos/__init__.py reads it
# back through importlib.metadata rather than repeating it; the literal in that
# file is a source-checkout fallback only and carries a "+source" suffix so the
# two can never silently disagree again (they did: 0.5.1 vs 0.9.0).
version = "0.12.0"
description = "A deny-by-default USB admission gate for Linux"
readme = "README.md"
authors = [{ name = "capitan0n" }]
requires-python = ">=3.10"
# GNU GPL version 3, or (at your option) any later version. An SPDX
# expression (PEP 639): the `{ text = ... }` table it replaces is deprecated in
# setuptools, and "GPLv3" did not say whether later versions apply.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["usb", "security", "badusb", "linux", "sysfs", "hardening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # No "License ::" classifier: with the SPDX expression above, PEP 639
    # makes the expression the one license statement in the metadata, and
    # setuptools refuses both together. (The classifier once said MIT while
    # everything else said GPL; one statement cannot disagree with itself.)
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

# Runtime dependencies. pyudev drives the event loop; the desktop-dialog
# backends (kdialog/zenity/tkinter) are optional and discovered at runtime,
# so they are deliberately NOT hard requirements here.
dependencies = [
    "pyudev>=0.24",
]

[project.optional-dependencies]
# `agent` stays an empty placeholder, kept so `pip install .[agent]` resolves:
# the agent's dialog backends (kdialog, zenity, and the tkinter fallback) are
# distro packages, not pip ones.
#
# `dev` is what the quality checks use, never what Probolos needs to run. The
# suite itself still runs on the standard library alone; with these installed
# it also runs the property-based tests (Hypothesis), the --rules tests
# (PyYAML), the lint (ruff), the type check (mypy) and the coverage
# measurement. CI installs the same tools at exact versions, from
# .github/requirements-ci.txt and, for mypy, requirements-typecheck.txt.
agent = []
# coverage[toml]: Python 3.10 has no tomllib, and without the extra coverage
# refuses to start on the [tool.coverage] config below.
dev = ["coverage[toml]>=7.10", "hypothesis", "mypy", "pyyaml", "ruff"]

[project.urls]
Homepage = "https://github.com/capitan0n/probolos"
Source = "https://github.com/capitan0n/probolos"
Changelog = "https://github.com/capitan0n/probolos/blob/main/CHANGELOG.md"

[project.scripts]
# `pip install` puts a `probolos` command on PATH, so it runs from any
# directory. The shipped systemd units and install.sh do not use it: the units
# run `/usr/bin/python3 -m probolos` and `/usr/bin/python3 -m probolos.agent`,
# with the package on PYTHONPATH=/opt/probolos or installed into the system
# Python (see systemd/README.md), and install.sh writes its own
# /usr/local/bin/probolos wrapper that runs the package from /opt/probolos.
probolos = "probolos.__main__:main"

[tool.setuptools]
# Explicit package list so the testbed/ and tests/ trees are not shipped as
# importable packages of the installed distribution.
packages = ["probolos"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pyflakes + pycodestyle errors (ruff's defaults), and two sets chosen for a
# program that runs as root and parses what hostile hardware sends it:
#
#   B  flake8-bugbear: likely bugs -- closures over a loop variable, mutable
#      default arguments, zip() silently dropping the tail, exceptions
#      re-raised without their cause.
#   S  flake8-bandit: security smells -- a shell anywhere, eval/exec, pickle,
#      weak hashes or `random` where a secret is needed, world-writable
#      permissions, hardcoded temporary paths, executables found via $PATH.
#
# The tree is clean against all of them; `ruff check .` is meant to stay that
# way. Every exception below says why it is one.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    # S603 flags EVERY subprocess call that does not use a shell -- that is,
    # the safe form, which is the only form here. What this project actually
    # holds to is stricter, and the rules that check it stay on: no shell at
    # all (S602, S604-S606), and no executable looked up through $PATH by a
    # literal name (S607). The one external tool root runs, loginctl, is
    # resolved by absolute path (session._find_loginctl).
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# The tests: bare asserts in the descriptor tests (S101), files
# made group- or world-writable on purpose to prove they are refused (S103),
# and test helpers that build real disk images with tools run by name (S607).
"tests/**" = ["S101", "S103", "S607"]

[tool.mypy]
# The code that runs as root, and the contract it is driven through: the
# modules coverage.yml calls the privilege boundary. Imports are followed, so
# what they use (trust, textsafe, ...) is checked as far as these reach it.
# The rest of the tree is not held to this yet.
files = [
    "probolos/protocol.py",
    "probolos/gate_server.py",
    "probolos/gate_client.py",
    "probolos/privsep.py",
    "probolos/securefs.py",
    "probolos/atomicio.py",
]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# pyudev ships no type information.
[[tool.mypy.overrides]]
module = ["pyudev", "pyudev.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["probolos"]
# The suite forks: privsep.start() runs the gate and the analyzer as child
# processes, which leave through os._exit. Each process writes its own data
# file (parallel) and `coverage combine` merges them; without the patches the
# children's lines would simply be missing from the count.
parallel = true
patch = ["fork", "_exit"]
# Left out of the count, because no unit test can reach what they do:
#
#   interrogate.py        a research instrument (CAPABILITIES.md 1.11), not
#                         on any execution path of the daemon. It issues raw
#                         control transfers to real hardware; its numbers
#                         come from interrogation_study.py on a bench.
#   countdown_dialog.py   a Tk window run in an interpreter of its own
#                         (dialogs.TkinterBackend). What it draws needs a
#                         display; what matters to the boundary -- its exit
#                         codes, and that anything else is no decision -- is
#                         tested from the caller's side in test_agent.py.
#
# Both are to be checked on real hardware and desktops instead: the hardware
# matrix, TESTING.md (ROADMAP 2.2).
omit = ["probolos/interrogate.py", "probolos/countdown_dialog.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
