[build-system]
# setuptools is the least surprising choice for a plain src-less layout and is
# already present on almost every distro. The build backend is what turns this
# tree into something `pip install .` understands.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probolos"
# THE single source of truth for the version. probolos/__init__.py reads it
# back through importlib.metadata rather than repeating it; the literal in that
# file is a source-checkout fallback only and carries a "+source" suffix so the
# two can never silently disagree again (they did: 0.5.1 vs 0.9.0).
version = "0.11.0"
description = "A deny-by-default USB admission gate for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
keywords = ["usb", "security", "badusb", "linux", "sysfs", "hardening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # GPL, not MIT. LICENSE, README and the `license` field above all say
    # GPLv3; this classifier said MIT, and the classifier is the one that ends
    # up in the published metadata -- so an installed package would have told
    # everyone the opposite of what the repository says, under the one heading
    # where being wrong has legal consequences rather than cosmetic ones.
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

# Runtime dependencies. pyudev drives the event loop; the desktop-dialog
# backends (kdialog/zenity/tkinter) are optional and discovered at runtime,
# so they are deliberately NOT hard requirements here.
dependencies = [
    "pyudev>=0.24",
]

[project.optional-dependencies]
# `agent` stays an empty placeholder, kept so `pip install .[agent]` resolves:
# the agent's dialog backends (kdialog, zenity, and the tkinter fallback) are
# distro packages, not pip ones.
#
# `dev` is what the quality checks use, never what Probolos needs to run. The
# suite itself still runs on the standard library alone; with these installed
# it also runs the property-based tests (Hypothesis), the --rules tests
# (PyYAML), the lint (ruff) and the coverage measurement. CI installs the same
# tools at the exact versions in .github/requirements-ci.txt.
agent = []
# coverage[toml]: Python 3.10 has no tomllib, and without the extra coverage
# would ignore [tool.coverage] below without a word.
dev = ["coverage[toml]>=7.10", "hypothesis", "pyyaml", "ruff"]

[project.urls]
Homepage = "https://github.com/capitan0n/probolos"
Source = "https://github.com/capitan0n/probolos"
Changelog = "https://github.com/capitan0n/probolos/blob/main/CHANGELOG.md"

[project.scripts]
# This is the payoff: `probolos` becomes a real command on PATH after install,
# which removes the "must cd to repo root" dependency and lets the systemd unit
# call an absolute ExecStart instead of `python -m probolos` with a WorkingDirectory.
probolos = "probolos.__main__:main"

[tool.setuptools]
# Explicit package list so the testbed/ and tests/ trees are not shipped as
# importable packages of the installed distribution.
packages = ["probolos"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pyflakes + pycodestyle errors (ruff's defaults), and two sets chosen for a
# program that runs as root and parses what hostile hardware sends it:
#
#   B  flake8-bugbear: likely bugs -- closures over a loop variable, mutable
#      default arguments, zip() silently dropping the tail, exceptions
#      re-raised without their cause.
#   S  flake8-bandit: security smells -- a shell anywhere, eval/exec, pickle,
#      weak hashes or `random` where a secret is needed, world-writable
#      permissions, hardcoded temporary paths, executables found via $PATH.
#
# The tree is clean against all of them; `ruff check .` is meant to stay that
# way. Every exception below says why it is one.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    # S603 flags EVERY subprocess call that does not use a shell -- that is,
    # the safe form, which is the only form here. What this project actually
    # holds to is stricter, and the rules that check it stay on: no shell at
    # all (S602, S604-S606), and no executable looked up through $PATH by a
    # literal name (S607). The one external tool root runs, loginctl, is
    # resolved by absolute path (session._find_loginctl).
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# The tests: bare asserts in the standalone descriptor tests (S101), files
# made group- or world-writable on purpose to prove they are refused (S103),
# and test helpers that build real disk images with tools run by name (S607).
"tests/**" = ["S101", "S103", "S607"]

[tool.coverage.run]
branch = true
source = ["probolos"]
# The suite forks: privsep.start() runs the gate and the analyzer as child
# processes, which leave through os._exit. Each process writes its own data
# file (parallel) and `coverage combine` merges them; without the patches the
# children's lines would simply be missing from the count.
parallel = true
patch = ["fork", "_exit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
