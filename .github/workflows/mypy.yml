name: mypy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    # A fixed release, as in systemd.yml: ubuntu-latest moves to a new Ubuntu
    # on its own (26.04 from 2026-10-19), and CI must not turn red with no
    # change here. Move it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-typecheck.txt
      # The root side and its protocol: the same modules coverage.yml holds
      # to a floor. Which files, and how strictly, is [tool.mypy] in
      # pyproject.toml, so `python -m mypy` locally checks the same thing.
      - run: python -m mypy
