name: coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Generous for a suite that takes about a minute. What it bounds is a
    # hang: a parser that never returned would otherwise hold the runner for
    # GitHub's default of six hours before anyone was told.
    timeout-minutes: 15
    env:
      # The code that runs as root, and the contract it is driven through:
      # where an untested line costs most.
      BOUNDARY: "probolos/protocol.py,probolos/gate_server.py,probolos/gate_client.py,probolos/privsep.py,probolos/securefs.py,probolos/atomicio.py"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-ci.txt
      # Measured as root, like tests-root.yml, so the tests that need root --
      # privsep.start() and the gate it forks -- count. Branch coverage, with
      # the forked children followed (see [tool.coverage.run] in
      # pyproject.toml). The ci profile makes the property tests take the same
      # inputs every run, so the numbers do not wander between runs.
      #
      # The floors sit about two points under what the suite reaches today
      # (total 85%, boundary 95%) so that interpreter noise does not trip
      # them and a real loss of tests does. Raise them as coverage grows;
      # lowering one needs a reason in the same commit. The total leaves out
      # interrogate.py and countdown_dialog.py ([tool.coverage.run] omit in
      # pyproject.toml says why).
      - name: Measure, report, and hold the floors
        run: |
          work="$(mktemp -d)"
          cp -r . "$work"
          chmod -R a+rX "$work"
          cd "$work"
          as_root() { sudo env "PATH=$PATH" HYPOTHESIS_PROFILE=ci "$@"; }
          as_root python -m coverage run -m tests.run_all
          as_root python -m coverage combine
          as_root python -m coverage report
          echo "--- privilege boundary:"
          as_root python -m coverage report --include="$BOUNDARY" --fail-under=93
          as_root python -m coverage report --fail-under=83 --format=total
