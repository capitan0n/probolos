name: tests as root

on:
  push:
  pull_request:

# Read-only token: like tests.yml, this only checks out and runs the suite.
permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install pyyaml
      # tests.yml runs as the unprivileged runner user, so every test that
      # needs root is skipped there -- privsep.start() among them, which forks
      # the root gate and drops the analyzer to `nobody`: the privilege
      # boundary itself. This job runs the same suite as root.
      #
      # From a world-readable copy, because the analyzer must be able to read
      # the code once it is `nobody`, and the runner's home need not let it.
      # The explicit PATH keeps setup-python's interpreter under sudo.
      - name: Run the suite as root
        run: |
          work="$(mktemp -d)"
          cp -r . "$work"
          chmod -R a+rX "$work"
          cd "$work"
          sudo env "PATH=$PATH" python -B -m tests.run_all
