name: shellcheck

# Only when a shell script (or this file) changes: there is nothing else for
# it to look at.
on:
  push:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", ".github/workflows/shellcheck.yml"]

permissions:
  contents: read

jobs:
  shellcheck:
    # A fixed release, as in systemd.yml: ubuntu-latest moves to a new Ubuntu
    # on its own (26.04 from 2026-10-19), and CI must not turn red with no
    # change here. Move it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install.sh runs as root, so a quoting or word-splitting bug in it is a
      # root bug. Every tracked *.sh is checked, so a new script is covered
      # without editing this file. ShellCheck ships with the runner image.
      - name: ShellCheck every tracked shell script
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
