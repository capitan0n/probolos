name: workflow lint

# Only when something under .github changes: the workflows are all it reads.
on:
  push:
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  lint:
    # A fixed release, as in systemd.yml: ubuntu-latest moves to a new Ubuntu
    # on its own (26.04 from 2026-10-19), and CI must not turn red with no
    # change here. Move it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Both linters at fixed versions, so a new release cannot turn CI red on
      # its own. zizmor comes from PyPI, which its authors publish to, pinned
      # in .github/requirements-lint.txt where Dependabot keeps it current.
      # actionlint is built from source by `go install`, which checks every
      # module against Go's public checksum database; Dependabot cannot see a
      # version in a run step, so that one moves by hand.
      - name: Install actionlint and zizmor
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python -m pip install -r .github/requirements-lint.txt
      # Syntax, expressions and types in every workflow, and ShellCheck on
      # every run: block (ShellCheck ships with the runner image).
      - name: actionlint
        run: |
          "$(go env GOPATH)/bin/actionlint"
      # Security: template injection, token permissions, credentials left in
      # the checkout, actions not pinned to a commit. Online, with the
      # read-only token, so it can also confirm each pinned commit really
      # belongs to the action's repository and has no known advisory.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github
