name: tests

on:
  push:
  pull_request:

# Read-only token: the workflow only checks out and runs the suite.
permissions:
  contents: read

jobs:
  test:
    # A fixed release, as in systemd.yml: ubuntu-latest moves to a new Ubuntu
    # on its own (26.04 from 2026-10-19), and CI must not turn red with no
    # change here. Move it on purpose.
    runs-on: ubuntu-24.04
    # Generous for a suite that takes about a minute. What it bounds is a
    # hang: a parser that never returned would otherwise hold the runner for
    # GitHub's default of six hours before anyone was told.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (pyproject requires-python), a middle release, and
        # the newest, which is what rolling distributions (Arch, Manjaro) ship.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The QA tools, at the exact versions every job uses. PyYAML lets the
      # --rules tests run instead of skipping and Hypothesis the property
      # tests; ruff is the linter configured in pyproject.toml. The suite
      # itself needs only the standard library, no root and no USB hardware.
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: ruff check .
      # The ci profile is derandomized: the same inputs on every run, so a red
      # build is reproducible rather than a coin toss (tests/test_properties.py).
      - run: python -m tests.run_all
        env:
          HYPOTHESIS_PROFILE: ci

  build:
    # The release build on every push. release.yml runs only on a tag, which is
    # too late to find a packaging problem; this uses its pins and its command.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-release.txt
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --no-isolation
      # pyproject.toml lists one package; tests/ and testbed/ must stay out.
      - name: The wheel holds the package alone
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          stray = [n for n in names if not n.startswith(("probolos/", "probolos-"))]
          print("\n".join(stray) or "ok")
          sys.exit(1 if stray else 0)
          PY
      # MANIFEST.in: the sdist carries the tests and everything they import.
      - name: The suite runs from the sdist
        run: |
          work="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$work"
          cd "$work"/probolos-*/
          python -m tests.run_all
