name: tests

on:
  push:
  pull_request:

# Read-only token: the workflow only checks out and runs the suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous for a suite that takes about a minute. What it bounds is a
    # hang: a parser that never returned would otherwise hold the runner for
    # GitHub's default of six hours before anyone was told.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (pyproject requires-python), a middle release, and
        # the newest, which is what rolling distributions (Arch, Manjaro) ship.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The QA tools, at the exact versions every job uses. PyYAML lets the
      # --rules tests run instead of skipping and Hypothesis the property
      # tests; ruff is the linter configured in pyproject.toml. The suite
      # itself needs only the standard library, no root and no USB hardware.
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: ruff check .
      # The ci profile is derandomized: the same inputs on every run, so a red
      # build is reproducible rather than a coin toss (tests/test_properties.py).
      - run: python -m tests.run_all
        env:
          HYPOTHESIS_PROFILE: ci
