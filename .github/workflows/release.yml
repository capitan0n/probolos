name: release

# A version tag (v0.12.0, v1.0.0b1, v1.0.0rc1, v1.0.0) on a commit of main
# runs the checks, builds the sdist and the wheel, writes SHA256SUMS, attests
# where they were built, and opens a DRAFT release with all of it attached.
# Nothing is published: the maintainer reads the draft and publishes it by
# hand. Nothing goes to PyPI.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # The same checks tests.yml runs on every push, on the tagged commit itself:
  # a tag on a commit whose CI was red, or never ran, builds nothing.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can see main.
          fetch-depth: 0
      # Anyone with write access can push a v* tag on any commit. Only one
      # that main already contains -- reviewed, through its rulesets -- is
      # released.
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; tag a commit of main"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: ruff check .
      - run: python -m tests.run_all
        env:
          HYPOTHESIS_PROFILE: ci

  build:
    needs: check
    # A fixed release, as in systemd.yml: ubuntu-latest moves to a new Ubuntu
    # on its own (26.04 from 2026-10-19), and CI must not turn red with no
    # change here. Move it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The build-provenance attestation: an OIDC token to sign with, and the
      # right to store the attestation on the repository.
      id-token: write
      attestations: write
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r .github/requirements-release.txt
      # The tag must name the version the files will carry. pyproject.toml is
      # the single source of truth (see probolos/__init__.py), and a v1.0.0
      # tag on a tree that still says 1.0.0rc2 would publish the wrong thing
      # under the right name. The version must also be written the way
      # PEP 440 normalises it: "1.0.0-beta.1" matched a v1.0.0-beta.1 tag
      # here and then built files named 1.0.0b1.
      #
      # Whether it is a pre-release is PEP 440's answer (a/b/rc/dev), not a
      # pattern on the tag, which missed .devN. A 0.x final is a normal
      # release, as v0.9.0 to v0.11.0 were: GitHub never marks a pre-release
      # "Latest", so marking 0.x would leave Latest on an older version. The
      # alpha status is in the classifiers and README.md.
      - name: The tag matches pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          canonical="$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$version")"
          if [ "$version" != "$canonical" ]; then
            echo "::error::pyproject.toml version $version is not in PEP 440 normal form ($canonical)"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          fallback="$(grep -o '"[^"]*+source"' probolos/__init__.py)"
          if [ "$fallback" != "\"$version+source\"" ]; then
            echo "::error::probolos/__init__.py fallback is $fallback, expected \"$version+source\""
            exit 1
          fi
          prerelease="$(python -c 'import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())' "$version")"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      # --no-isolation: build with the pinned setuptools just installed, not
      # whatever is newest on PyPI. SOURCE_DATE_EPOCH (the commit time) makes
      # the wheel byte-reproducible; set on the run line, because a $(...) in
      # an env: block is not expanded.
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --no-isolation
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creating a release; nothing else.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # A pre-release for a/b/rc/dev versions (the build job asks PEP 440),
      # a normal release for a final, 0.x included. Draft either way.
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          kind=()
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$REPO" --draft "${kind[@]}" --verify-tag \
            --title "Probolos ${TAG#v}" \
            --notes "See CHANGELOG.md for what changed. Verify a download with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $REPO\`."
